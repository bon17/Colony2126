<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>콜로니 2126</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d0c1d; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center;
         touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; background: #1d1b3a; outline: none; }
  #rotate { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
            gap: 16px; background: #1d1b3a; color: #fff3dc; z-index: 10; text-align: center;
            font: 700 22px/1.5 "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }
  #rotate .phone { width: 46px; height: 78px; border: 4px solid #2bc4b4; border-radius: 10px; animation: turn 2s ease-in-out infinite; }
  @keyframes turn { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" tabindex="0"></canvas>
<div id="rotate"><div class="phone"></div><div>가로로 돌려 주세요</div></div>
<script src="js/data.js"></script>
<script src="js/game.js"></script>
</body>
</html>
